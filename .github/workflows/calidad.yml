name: Calidad Android y contenido

on:
  push:
    branches: [desarrollo, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IDREYK_SUPABASE_URL: ''
      IDREYK_SUPABASE_PUBLISHABLE_KEY: ''
      IDREYK_EXPECTED_CERT_SHA256: ''
    steps:
      - name: Obtener fuentes sin conservar credenciales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: content-tools/requirements.txt
      - name: Node para PostgreSQL local de pruebas
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
          package-manager-cache: false
      - name: Dependencias de prueba
        run: |
          python -m pip install -r content-tools/requirements.txt
          npm ci --prefix backend --ignore-scripts
      - name: SDK del runner (sin desplegar servicios)
        run: |
          "${ANDROID_HOME:?Falta Android SDK}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"
      - name: Pruebas, lint, ensamblado y verificación de APK
        run: bash scripts/comprobar.sh --todo
      - name: Evidencias, incluso si falla una comprobación
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidencia-local-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .cache/qa-actual/*.txt
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.xml
      - name: APK de CI con firma temporal, NO actualización del APK entregado
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-ci-firma-temporal-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk

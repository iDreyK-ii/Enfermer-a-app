name: Clinical scale catalog integrity
on:
  push:
    branches: ["integracion/escalas360-191"]
    paths:
      - "research/escalas/catalogo_fuente.json"
      - "research/escalas/compilar_catalogo.py"
      - "app/src/main/assets/escalas_clinicas_v1.json"
      - "tools/validate_scale_catalog.py"
      - "scripts/tests/test_catalogo_clinico.py"
      - ".github/workflows/catalog-integrity.yml"
  pull_request:
    branches: ["desarrollo"]
    paths:
      - "research/escalas/catalogo_fuente.json"
      - "research/escalas/compilar_catalogo.py"
      - "app/src/main/assets/escalas_clinicas_v1.json"
      - "tools/validate_scale_catalog.py"
      - "scripts/tests/test_catalogo_clinico.py"
      - ".github/workflows/catalog-integrity.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify editorial source regenerates the Android asset byte-for-byte
        run: python research/escalas/compilar_catalogo.py --comprobar
      - name: Run editorial catalog tests
        run: python scripts/tests/test_catalogo_clinico.py
      - name: Validate records, sources, population and allowed service mappings
        run: python tools/validate_scale_catalog.py app/src/main/assets/escalas_clinicas_v1.json
